name: Build Valid IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build IPA Structure
      run: |
        mkdir -p Payload/GenshinKeyboard.app
        cp Info.plist Payload/GenshinKeyboard.app/
        cp *.swift Payload/GenshinKeyboard.app/
        cp *.py Payload/GenshinKeyboard.app/
        # ضغط الهيكل الصحيح
        zip -r GenshinKeyboard.ipa Payload
    - uses: actions/upload-artifact@v4
      with:
        name: GenshinKeyboard-Real-IPA
        path: GenshinKeyboard.ipa