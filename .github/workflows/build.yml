name: Build iOS Keyboard

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'

    - name: Build Project
      run: |
        echo "Building the iOS Keyboard Extension..."
        # أوامر بناء المشروع وترجمته عبر سحابة غيتهاب
        xcodebuild -version
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Core Script Test
      run: |
        python GenshinCore.py