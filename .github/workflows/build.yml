name: Build iOS IPA Package

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Create IPA Package
      run: |
        mkdir -p Payload
        cp *.swift Payload/ || true
        cp *.py Payload/ || true
        # ضغط ملفات المشروع بصيغة جاهزة
        zip -r GenshinKeyboard.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenshinKeyboard-IPA
        path: GenshinKeyboard.ipa