name: Build iOS Keyboard

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.5.0'

    - name: Build and Package Extension
      run: |
        echo "Starting Xcode build and packaging..."
        swift setup_project.swift
        mkdir -p build/Payload
        # تجميع ملفات الكيبورد
        cp KeyboardViewController.swift build/
        cd build && zip -r GenshinKeyboard.zip .

    - name: Upload Keyboard Package
      uses: actions/upload-artifact@v4
      with:
        name: GenshinKeyboard-iPad-Build
        path: build/GenshinKeyboard.zip